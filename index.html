function renderArchive(query=''){const q=query.trim();const filtered=history.filter(d=>!q||String(d.sequence).includes(q)||d.main.concat(d.additional).some(n=>String(n)===q)).slice().reverse();const body=filtered.map(d=>`<tr><td class="method">${d.sequence}</td><td>${d.main.join(' · ')}</td><td>${d.additional}</td></tr>`).join('');$('#drawRows').innerHTML=body||'<tr><td colspan="3" class="empty">No matching draws</td></tr>';$('#drawCount').textContent=`${filtered.length} draws`}
